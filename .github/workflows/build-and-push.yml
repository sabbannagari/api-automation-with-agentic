name: Build & Push Docker Image to GHCR

on:
  push:
    paths:
      - 'automation/**'
      - 'build/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.actor }}/agentic-automation  # GHCR username + repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build tag (buildnumber-commitsha)
        id: buildtag
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          BUILD_TAG="build${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "build_tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "Build tag will be: $BUILD_TAG"

      - name: Build & Push Docker Image (short tag only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.buildtag.outputs.build_tag }}

